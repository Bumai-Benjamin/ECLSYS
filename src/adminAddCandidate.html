<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add candidate · ECN E-Vote admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&amp;display=swap">
  <link href="/assets/css/material-dashboard.css?v=2.1.2" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body data-nav="admin" data-page="add">
  <a class="skip-link" href="#content">Skip to content</a>
  <nav id="app-shell" aria-label="Main"></nav>
  <script src="/js/shell.js"></script>
  <div class="page">
    <main id="content" class="page-main" tabindex="-1">
      <div id="wallet-status" class="status-panel" role="status" aria-live="polite"></div>
      <header class="page-intro">
        <h1>Add candidate</h1>
        <p>Candidates can only be added during Registration. Each one is saved on the blockchain and can't be removed.</p>
      </header>
      <section class="panel content-narrow" aria-labelledby="cand-title">
        <h2 id="cand-title">Candidate details</h2>
        <p id="candidate-form-locked" class="alert alert-warning" hidden>Candidates can only be added during Registration.</p>
        <form data-action="addCandidate" id="candidate-form" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="name">Full name</label>
              <input type="text" id="name" autocomplete="off" required>
              <p class="field-error" id="name-error" hidden></p>
            </div>
            <div class="field">
              <label for="party">Party</label>
              <input type="text" id="party" autocomplete="off" required>
              <p class="field-error" id="party-error" hidden></p>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="age">Age</label>
              <input type="text" id="age" inputmode="numeric" autocomplete="off" required>
              <p class="field-error" id="age-error" hidden></p>
            </div>
            <div class="field">
              <label for="qualification">Qualification</label>
              <input type="text" id="qualification" autocomplete="off" required>
              <p class="field-error" id="qualification-error" hidden></p>
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary">Add candidate</button>
          </div>
        </form>
        <div id="candidate-progress" class="progress-line" aria-live="polite"></div>
        <p id="candidate-added" class="alert alert-success" role="status" hidden>Candidate added. <a href="/candidateDetails">See all candidates</a></p>
      </section>
    </main>
  </div>
  <script src="assets/js/core/jquery.min.js"></script>
  <script src="js/web3.min.js"></script>
  <script src="js/truffle-contract.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/errors.js"></script>
  <script src="js/wallet-status.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/pending.js"></script>
  <script src="js/validate-candidate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
