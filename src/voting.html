<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vote · ECN E-Vote</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&amp;display=swap">
  <link href="/assets/css/material-dashboard.css?v=2.1.2" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body data-nav="voter" data-page="voting">
  <a class="skip-link" href="#content">Skip to content</a>
  <nav id="app-shell" aria-label="Main"></nav>
  <script src="/js/shell.js"></script>
  <div class="page">
    <main id="content" class="page-main" tabindex="-1">
      <div id="chainError" class="alert alert-danger chain-error" role="alert"></div>
      <header class="page-intro">
        <h1>Vote</h1>
        <p>Choose one candidate. You can vote once, and you can't change your vote afterwards.</p>
      </header>
      <ol id="steps" class="steps" aria-label="Your progress"></ol>
      <div id="currentPhase"></div>
      <p id="loader" class="muted">Loading the candidates…</p>
      <section id="chain-content" class="panel" aria-labelledby="ballot-title">
        <h2 id="ballot-title">Ballot</h2>
        <form data-action="castVote">
          <div class="field">
            <label for="contestantSelect">Candidate</label>
            <select id="contestantSelect"></select>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary">Cast your vote</button>
          </div>
        </form>
        <p id="accountAddress" class="muted"></p>
      </section>
    </main>
  </div>
  <script src="assets/js/core/jquery.min.js"></script>
  <script src="js/web3.min.js"></script>
  <script src="js/truffle-contract.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/errors.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
