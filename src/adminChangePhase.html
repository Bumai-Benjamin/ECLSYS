<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Election phase · ECN E-Vote admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&amp;display=swap">
  <link href="/assets/css/material-dashboard.css?v=2.1.2" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body data-nav="admin" data-page="phase">
  <a class="skip-link" href="#content">Skip to content</a>
  <nav id="app-shell" aria-label="Main"></nav>
  <script src="/js/shell.js"></script>
  <div class="page">
    <main id="content" class="page-main" tabindex="-1">
      <div id="wallet-status" class="status-panel" role="status" aria-live="polite"></div>
      <header class="page-intro">
        <h1>Election phase</h1>
        <p>The election moves forward one phase at a time and never goes back.</p>
      </header>
      <section id="chain-content" class="panel" aria-labelledby="phase-title">
        <h2 id="phase-title">Current phase</h2>
        <ol id="phase-timeline" class="timeline" aria-label="Election phases">
          <li data-phase="0">Registration</li>
          <li data-phase="1">Voting</li>
          <li data-phase="2">Closed</li>
        </ol>
        <p id="currentPhaseAdmin" class="visually-hidden"></p>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="next-phase" hidden></button>
        </div>
        <p id="next-phase-explain"></p>
        <div id="phase-progress" class="progress-line" aria-live="polite"></div>
      </section>
      <p id="loader" class="muted">Loading…</p>
    </main>
  </div>

  <dialog id="confirm-phase" aria-labelledby="confirm-phase-title">
    <h2 id="confirm-phase-title"></h2>
    <p id="confirm-phase-text"></p>
    <div class="field">
      <label for="confirm-word">Type <strong id="confirm-word-target"></strong> to confirm</label>
      <input type="text" id="confirm-word" autocomplete="off" spellcheck="false" aria-describedby="confirm-word-hint">
      <span class="hint" id="confirm-word-hint">This can't be undone.</span>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="confirm-phase-ok" disabled>Confirm</button>
      <button type="button" class="btn btn-secondary-outline" id="confirm-phase-cancel">Cancel</button>
    </div>
  </dialog>
  <script src="assets/js/core/jquery.min.js"></script>
  <script src="js/web3.min.js"></script>
  <script src="js/truffle-contract.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/errors.js"></script>
  <script src="js/wallet-status.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/pending.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
