<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags must come first in the head; any other head content must come after these tags -->
    <title>ECL - Namibia</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

  </head>
  <body>
<div id="chainError" class="alert alert-danger" role="alert" style="display:none; position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:2000; max-width:90%;"></div>
    <div class="container" style="width: 700px">
      <div id="currentPhase">

      </div>
      <div id="content">
          <table class="table">
            <thead>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Party</th>
              <th scope="col">Votes</th>
            </thead>
            <tbody id="contestantsResults">
  
            </tbody>
            <hr/>
            <p id="accountAddress" class="text-center"></p>
          </table>
  
          <form data-action="castVote">
            <div class="form-group">
              <label for="contestantSelect">Select Contestant</label>
              <select class="select-control" id="contestantSelect"></select>
            </div>
            <button type="submit" class="btn btn-primary">Cast your vote</button>
          </form>
      </div>
  </div>
      



    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="assets/js/core/jquery.min.js"></script>
    <!-- Include all compiled plugins (below), or include individual files as needed -->
    <script src="js/bootstrap.min.js"></script>
    <script src="js/web3.min.js"></script>
    <script src="js/truffle-contract.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/errors.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
