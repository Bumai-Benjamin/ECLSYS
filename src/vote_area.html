<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voting area · ECN E-Vote</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&amp;display=swap">
  <link href="/assets/css/material-dashboard.css?v=2.1.2" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body data-nav="voter" data-page="voting">
  <a class="skip-link" href="#content">Skip to content</a>
  <nav id="app-shell" aria-label="Main"></nav>
  <script src="/js/shell.js"></script>
  <div class="page">
    <main id="content" class="page-main" tabindex="-1">
      <div id="wallet-status" class="status-panel" role="status" aria-live="polite"></div>
      <header class="page-intro">
        <h1>Voting area</h1>
        <p>This page has moved. Please use the <a href="/voting">Vote</a> page to cast your vote.</p>
      </header>
      <div id="currentPhase"></div>
      <section id="chain-content" class="panel" aria-labelledby="cands-title">
        <h2 id="cands-title">Candidates</h2>
        <div class="table-wrap">
          <table class="table table-stack">
            <thead><tr><th scope="col">#</th><th scope="col">Name</th><th scope="col">Age</th><th scope="col">Party</th><th scope="col">Qualification</th><th scope="col">Votes</th></tr></thead>
            <tbody id="contestantsResultsAdmin"></tbody>
          </table>
        </div>
      </section>
      <p id="loader" class="muted">Loading…</p>
    </main>
  </div>
  <script src="assets/js/core/jquery.min.js"></script>
  <script src="js/web3.min.js"></script>
  <script src="js/truffle-contract.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/errors.js"></script>
  <script src="js/wallet-status.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/pending.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
